t="700">−</tspan>  long inputs → slow at serving time</text><text x="52.0" y="388.0" font-size="11.5" fill="#d3ddd8" text-anchor="start" font-weight="400" fill-opacity="1.0"><tspan fill="#ff5f56" font-weight="700">−</tspan>  noisy metadata derails it</text><text x="531.0" y="104.0" font-size="11" fill="#7f8e89" text-anchor="start" font-weight="400" fill-opacity="1.0">metadata embeddings are blended in afterwards</text><rect x="531.0" y="118.0" width="110.0" height="26.0" rx="5" fill="#121819" fill-opacity="1.0" stroke="#2a3739" stroke-opacity="1.0" stroke-width="1.2"/><text x="541.0" y="135.0" font-size="11" fill="#d3ddd8" text-anchor="start" font-weight="400" fill-opacity="1.0"><tspan fill="#d3ddd8">grass court</tspan></text><path d="M586.0,146.0 L586.0,172.0" fill="none" stroke="#1f9b5c" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1f9b5c)"/><rect x="546.0" y="176.0" width="80.0" height="40.0" rx="7" fill="#3dff9a" fill-opacity="0.1" stroke="#3dff9a" stroke-opacity="0.85" stroke-width="1.2"/><text x="586.0" y="199.8" font-size="11" fill="#3dff9a" text-anchor="middle" font-weight="700" fill-opacity="1.0">encoder</text><rect x="700.0" y="118.0" width="150.0" height="98.0" rx="8" fill="#f5c542" fill-opacity="0.07" stroke="#f5c542" stroke-opacity="0.7" stroke-width="1.2"/><text x="775.0" y="138.0" font-size="11" fill="#f5c542" text-anchor="middle" font-weight="700" fill-opacity="1.0">memory bank</text><rect x="712.0" y="150.0" width="9.0" height="12.0" rx="2" fill="#3dff9a" fill-opacity="0.45" stroke="#3dff9a" stroke-opacity="0.9" stroke-width="1.2"/><rect x="722.0" y="150.0" width="9.0" height="12.0" rx="2" fill="#3dff9a" fill-opacity="0.45" stroke="#3dff9a" stroke-opacity="0.9" stroke-width="1.2"/><rect x="732.0" y="150.0" width="9.0" height="12.0" rx="2" fill="#3dff9a" fill-opacity="0.45" stroke="#3dff9a" stroke-opacity="0.9" stroke-width="1.2"/><text x="746.0" y="160.0" font-size="10" fill="#d3ddd8" text-