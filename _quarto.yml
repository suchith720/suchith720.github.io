project:
  type: website
  resources:
    - data/suchith_prabhu_cv.pdf

website:
  title: "root@utopia"
  description: "The kingdom of Utopia — stories, research and adventures of Suchith Prabhu, PhD scholar in extreme classification."
  site-url: https://suchith720.github.io
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card:
    creator: "@suchith720"
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#07090a"
    left:
      - href: index.qmd
        text: "~/home"
      - href: about.qmd
        text: "~/king"
      - href: research_blog.qmd
        text: "~/workshop"
      - href: adventure_blog.qmd
        text: "~/expeditions"
      - href: data/suchith_prabhu_cv.pdf
        text: "cv.pdf"
    right:
      - icon: github
        href: https://github.com/suchith720
        aria-label: GitHub
      - icon: twitter-x
        href: https://twitter.com/suchith720
        aria-label: Twitter / X

  page-footer:
    left: |
      <span class="ft-prompt">[root@utopia ~]$</span> echo "Always hunting for my next life adventure."
    right: |
      <span class="ft-muted">© Kingdom of Utopia · built with Quarto + caffeine</span>

format:
  html:
    theme:
      - darkly
      - assets/utopia.scss
    highlight-style: monokai
    toc: true
    toc-title: "// contents"
    bread-crumbs: false
    smooth-scroll: true
    code-copy: true
    anchor-sections: true
    include-in-header: _includes/head.html
    include-after-body: _includes/utopia.html
